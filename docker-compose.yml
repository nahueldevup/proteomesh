# LEGACY / NO CANÓNICO.
# El camino soportado es: python3 tools/instance_manager.py create|start.
# Este compose solo se usa con un perfil ya renderizado (generated_identity)
# y un volumen de instancia, nunca con data-clean ni con un template crudo.
# Se ejecuta con: tools/compose_up_safe.sh
services:
  redroid:
    profiles: ["legacy"]
    image: proteomesh:latest
    container_name: redroid-clean
    privileged: true
    restart: unless-stopped
    cpuset: "0-7"
    mem_limit: 2560m
    mem_reservation: 1536m
    ports:
      - "5580:5555"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    volumes:
      - ${PROTEOMESH_DATA:?definir_PROTEOMESH_DATA}:/data
      - ${PROTEOMESH_PROFILE:?definir_PROTEOMESH_PROFILE}:/system/etc/proteomesh_profile.json:ro
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_redroid_c2=1
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2340
      - androidboot.redroid_dpi=440
      - androidboot.redroid_fps=90
